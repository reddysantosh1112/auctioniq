uted)}.small{font-size:12px}.gold{color:var(--gold)}.green{color:var(--green)}.red{color:var(--red)}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.row>*{min-width:0}.between{justify-content:space-between}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:610px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}th{color:var(--muted);font-size:12px;font-weight:600}td input,td select{padding:6px;min-width:75px}.pill{border:1px solid var(--line);border-radius:30px;padding:3px 8px;color:var(--muted);font-size:11px}.notice{background:#43306b;border:1px solid #8a6f35;border-radius:10px;padding:12px;margin:10px 0}.bar{height:8px;background:#3b2c82;border-radius:5px;overflow:hidden}.fill{height:100%;background:var(--gold)}.hide{display:none!important}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.modalback{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:15px;z-index:5}.modal{background:var(--panel);border:1px solid var(--gold);border-radius:14px;padding:23px;max-width:520px;width:100%}.logo{width:35px;height:35px;object-fit:contain;background:#ffffff1a;border-radius:6px} .tabs{display:flex;gap:7px;margin:12px 0;flex-wrap:wrap}.tabs button.selected{border-color:var(--gold);color:var(--gold)}.score{display:flex;align-items:center;gap:8px;margin:9px 0}.score .name{width:150px;font-size:12px}.score .bar{flex:1}.score .num{width:40px;text-align:right}.tag{padding:3px 7px;background:#41318f;border-radius:6px;font-size:11px}.empty{padding:30px;text-align:center;color:var(--muted)}.toast{position:fixed;bottom:18px;right:18px;background:#1f4a45;color:white;padding:12px 16px;border-radius:9px;z-index:10;max-width:400px}.foot{color:var(--muted);font-size:11px;margin-top:20px}@media(max-width:950px){aside{width:190px}main{padding:15px}.grid{grid-template-columns:repeat(2,1fr)}.two,.three{grid-template-columns:1fr}}@media(max-width:650px){.layout{display:block} function validateSale(p,id,price){if(!p)return 'Select a player.';if(status(p)==='Pre-Signed')return 'Pre-signed players cannot be auctioned.';if(status(p)==='Sold')return 'Player already sold. Use correction.';if(!team(id))return 'Select a franchise.';if(!Number.isFinite(price)||price<0)return 'Enter a valid selling price.';if(price>purse(id))return 'Insufficient franchise purse.';if(roster(id).length>=db.config.max)return 'Franchise squad is full.';if(p.outstation==='Yes'&&outside(id)>=db.config.outstation)return 'Outstation player limit exceeded.';return ''}function commitSale(p,id,price){let old=needs(p,id).score;db.results.push({id:uid(),playerId:p.id,teamId:id,price,status:'Sold',time:new Date().toISOString()});audit('Sale',`${p.name} sold to ${team(id).name} for ${money(price)}`);save();draw();let v=myTarget(p.id),msg=`${p.name} sold to ${team(id).name}. Franchise squad and purse updated.`;if(v&&id===db.config.myTeam){let diff=num(v.budget)-price;msg+=diff>=0?` Budget saved: ${money(diff)}.`:` Budget overspent: ${money(-diff)}.`;if(diff<0)promptBudget('Overspend',-diff,p.id);else if(diff>0)promptBudget('Savings',diff,p.id)}else if(id!==db.config.myTeam){msg+=` ${team(id).name} now has ${roster(id).filter(x=>x.role===p.role).length} ${p.role||'role'} player(s).`}toast(msg);afterSale(p,id)}function recordUnsold(){let p=player(selected);if(!p)return;if(status(p)!=='Available'){alert('Only available players can be marked unsold.');return}db.results.push({id:uid(),playerId:p.id,status:'Unsold',time:new Date().toISOString()});audit('Unsold',p.name);save();draw();toast(p.name+' marked unsold.')}function editSale(){let p=player(selected),r=p&&result(p);if(!r){alert('No result to correct.');return}let name=p.name;let id=r.id;modal(`<h2>Correct result — ${esc(name)}</h2><p class="small" style="color:var(--gold)">This recalculates purse, squad, strategy and reports, and is saved in the audit log.</p><label>Status</label><select id="fixStatus"><option>Sold</option><optio modal(`<h2>Backup purchased: ${esc(p.name)}</h2><p>${esc(p.name)} (bought for ${money(purchase(p).price)}) was your backup #${t.backups.indexOf(b)+1} for <b>${esc(pr.name)}</b>.</p><p>Replace ${esc(pr.name)} with ${esc(p.name)}, or still go for ${esc(pr.name)}?</p><div class="buttons"><button class="primary" onclick="backupAnswer('${p.id}','${t.id}',true)">Yes – replace ${esc(pr.name)}</button><button onclick="backupAnswer('${p.id}','${t.id}',false)">No – still target ${esc(pr.name)}</button></div>`)}
function backupAnswer(pid,tid,yes){let p=player(pid),t=db.targets.find(x=>x.id===tid),b=t.backups.find(x=>x.playerId===pid);closeModal();
if(yes){BQ=[];BQno=[];let plan=num(b.budget)||num(t.budget);t.replacedBy=pid;t.replPlan=plan;audit('Backup replaces primary',p.name+' replaces '+player(t.playerId).name);save();draw();toast(p.name+' replaces '+player(t.playerId).name+' on your board');let d=plan-purchase(p).price;if(d>0)promptBudget('Savings',d,pid);else if(d<0)promptBudget('Overspend',-d,pid);return}
BQno.push(player(t.playerId).name);backupAsk(p)}
function backupDone(p){let n=BQno.join(', ');BQno=[];replaceAsk(p,'You are still targeting '+n+'.')}
function replaceAsk(p,intro){let pr=purchase(p),ts=openTargets().filter(t=>t.playerId!==p.id).sort((a,b)=>(player(b.playerId).role===p.role)-(player(a.playerId).role===p.role)),sq=roster(db.config.myTeam).filter(x=>x.id!==p.id);
modal(`<h2>${intro?'Who does '+esc(p.name)+' replace?':'Unplanned purchase: '+esc(p.name)}</h2><p>${intro?esc(intro)+' ':`${esc(p.name)} (${esc(p.role||'role unknown')}) is not in your targets or backups. `}Bought for ${money(pr.price)}. Which target or squad player does he replace?</p><label>Replaces</label><select id="repT"><option value="">None – extra squad depth</option><optgroup label="Open targets">${ts.map(t=>`<option value="t:${t.id}">${esc(player(t.playerId).name)} · ${esc(player(t.playerId).role)} · planned ${money(t.budget)}</option>`).join('')}</optgroup><optgroup label="Current squad (incl. pre-signed)">${sq.map(x=>`<option value="p:${x.id}">${esc(x.name)} · ${esc(x.role)} · ${presign(x)?'Pre-signed':'Purchased'}</option>`).join('')}</optgroup></select><p class="small muted">Same-role targets are listed first. Replacing a target compares its planned budget with this price. Your real purse is unaffected.</p><div class="buttons"><button class="primary" onclick="applyReplace('${p.id}')">Confirm</button><button onclick="closeModal()">Skip</button></div>`)}
function applyReplace(pid){let v=document.getElementById('repT').value,p=player(pid);closeModal();if(!v){audit('Unplanned',p.name+' kept as extra depth');save();return}
if(v[0]==='p'){let o=player(v.slice(2));db.swaps.push({id:uid(),newId:p.id,oldId:o.id,time:new Date().toISOString()});audit('Squad swap',p.name+' replaces '+o.name);save();draw();return toast(p.name+' replaces '+o.name+' in your squad plan')}
let t=db.targets.find(x=>x.id===v.slice(2)),price=purchase(p).price;t.replacedBy=p.id;delete t.replPlan;audit('Replacement',p.name+' replaces target '+player(t.playerId).name);save();let d=num(t.budget)-price;draw();toast(p.name+' replaces '+player(t.playerId).name);if(d>0)promptBudget('Savings',d,p.id);else if(d<0)promptBudget('Overspend',-d,p.id)}
function previewCorrection(id){let r=db.results.find(x=>x.id===id),p=player(r.playerId),st=document.getElementById('fixStatus').value,tid=Number(document.getElementById('fixTeam').value),price=Number(document.getElementById('fixPrice').value);
let keep=db.results;db.results=keep.filter(x=>x.id!==id);let err=st==='Sold'?validateSale(p,tid,price):'';db.results=keep;if(err)return blockModal([err]);
let rows=[],oT=r.status==='Sold'?r.teamId:null,nT=st==='Sold'?tid:null;const row=(t,np,ns)=>`<tr><td>${esc(team(t).name)}</td><td>${money(purse(t))} → <b>${money(np)}</b></td><td>${roster(t).length} → <b>${ns}</b></td></tr>`;
if(oT!==null&&oT===nT)rows.push(row(oT,purse(oT)+num(r.price)-price,roster(oT).length));else{if(oT!==null)rows.push(row(oT,purse(oT)+num(r.price),roster(oT).length-1));if(nT!==null)rows.push(row(nT,purse(nT)-price,roster(nT).length+1))}
modal(`<h2>Review correction — ${esc(p.name)}</h2><p class="small muted">Was: ${esc(r.status)}${r.status==='Sold'?' · '+esc(team(r.teamId).name)+' · '+money(r.price):''}<br>Now: ${esc(st)}${st==='Sold'?' · '+esc(team(tid).name)+' · '+money(price):''}</p>${rows.length?`<table><tr><th>Team</th><th>Purse</th><th>Squad</th></tr>${rows.join('')}</table>`:'<p>No purse change.</p>'}<p class="small" style="color:var(--gold)">Strategy, budgets and reports recalculate. Saved in the audit log.</p><input type="hidden" id="fixStatus" value="${esc(st)}"><input type="hidden" id="fixTeam" value="${Number.isFinite(tid)?tid:''}"><input type="hidden" id="fixPrice" value="${price||0}"><div class="buttons"><button onclick="closeModal()">Cancel</button><button class="primary enter" onclick="correctSale('${id}')">Apply correction (Enter)</button></div>`)}
const _dec=decorate;decorate=function(){_dec();if(page==='My Auction Strategy'&&!document.getElementById('swapcard')){let d=document.createElement('div');d.className='card';d.id='swapcard';d.innerHTML='<h2>Planned squad swaps</h2>'+(db.swaps.map(w=>`<p class="small">${esc(player(w.newId)?.name)} replaces ${esc(player(w.oldId)?.name)} <span class="muted">· ${new Date(w.time).toLocaleString()}</span></p>`).join('')||'<p class="muted">None.</p>');document.getElementById('app').append(d)}};
draw();
</script></body></html>
