.myTeam).length-1)*Math.min(...Object.values(db.config.base).map(num));return Math.max(0,Math.min(suggested,purse(db.config.myTeam)-reserve))}function targetVariance(){let s=0,o=0;db.results.filter(r=>r.status==='Sold'&&r.teamId===db.config.myTeam).forEach(r=>{let t=myTarget(r.playerId)||db.targets.find(x=>x.replacedBy===r.playerId);if(t){let d=num(t.replPlan!=null&&t.replacedBy===r.playerId?t.replPlan:t.budget)-num(r.price);if(d>0)s+=d;else o-=d}});return {saved:s,over:o,net:s-o}}function allocated(){return db.adjustments.reduce((s,a)=>s+num(a.amount)*(a.type==='Savings'?1:0),0)}function unallocated(){return Math.max(0,targetVariance().saved-allocated())}function metric(l,v,cls=''){return `<div class="card"><div class="muted small">${esc(l)}</div><div class="metric ${cls}">${esc(v)}</div></div>`}function opts(items,value='',placeholder='Select'){return `<option value="">${esc(placeholder)}</option>`+items.map(x=>`<option value="${esc(x.id)}" ${String(x.id)===String(value)?'selected':''}>${esc(x.name)}</option>`).join('')}function teamOpts(v){return opts(db.teams,v,'Select franchise')}function playerOpts(v){return opts(db.players,v,'Select player')}function draw(){document.getElementById('nav').innerHTML=navs.map(n=>`<button class="${page===n?'active':''}" onclick='page=${JSON.stringify(n)};draw()'>${esc(n)}</button>`).join('');document.getElementById('app').innerHTML=({'Live Auction':live,'Player Database & Scouting':playersView,'My Auction Strategy':strategy,'Franchise Intelligence':franchise,'Auction Reports':reports,'Settings':settings})[page]();}function live(){let p=player(selected),t=db.config.myTeam,v=targetVariance();let head=`<h1>Live Auction Command Centre</h1><div class="sub">Select a player, enter the winning franchise and final price. All connected modules update automatically.</div><div class="grid">${metric('Our remaining purse',money(purse(t)))}${metric('Our squad',roster(t).length+' / '+db.config.max)}${metric('Unallocated savings',money(unallocate function validateSale(p,id,price){if(!p)return 'Select a player.';if(status(p)==='Pre-Signed')return 'Pre-signed players cannot be auctioned.';if(status(p)==='Sold')return 'Player already sold. Use correction.';if(!team(id))return 'Select a franchise.';if(!Number.isFinite(price)||price<0)return 'Enter a valid selling price.';if(price>purse(id))return 'Insufficient franchise purse.';if(roster(id).length>=db.config.max)return 'Franchise squad is full.';if(p.outstation==='Yes'&&outside(id)>=db.config.outstation)return 'Outstation player limit exceeded.';return ''}function commitSale(p,id,price){let old=needs(p,id).score;db.results.push({id:uid(),playerId:p.id,teamId:id,price,status:'Sold',time:new Date().toISOString()});audit('Sale',`${p.name} sold to ${team(id).name} for ${money(price)}`);save();draw();let v=myTarget(p.id),msg=`${p.name} sold to ${team(id).name}. Franchise squad and purse updated.`;if(v&&id===db.config.myTeam){let diff=num(v.budget)-price;msg+=diff>=0?` Budget saved: ${money(diff)}.`:` Budget overspent: ${money(-diff)}.`;if(diff<0)promptBudget('Overspend',-diff,p.id);else if(diff>0)promptBudget('Savings',diff,p.id)}else if(id!==db.config.myTeam){msg+=` ${team(id).name} now has ${roster(id).filter(x=>x.role===p.role).length} ${p.role||'role'} player(s).`}toast(msg);afterSale(p,id)}function recordUnsold(){let p=player(selected);if(!p)return;if(status(p)!=='Available'){alert('Only available players can be marked unsold.');return}db.results.push({id:uid(),playerId:p.id,status:'Unsold',time:new Date().toISOString()});audit('Unsold',p.name);save();draw();toast(p.name+' marked unsold.')}function editSale(){let p=player(selected),r=p&&result(p);if(!r){alert('No result to correct.');return}let name=p.name;let id=r.id;modal(`<h2>Correct result — ${esc(name)}</h2><p class="small" style="color:var(--gold)">This recalculates purse, squad, strategy and reports, and is saved in the audit log.</p><label>Status</label><select id="fixStatus"><option>Sold</option><optio function playersView(){let q=filter.toLowerCase(),list=db.players.filter(p=>[p.name,p.role,p.category].join(' ').toLowerCase().includes(q));return `<h1>Player Database & Scouting</h1><div class="sub">Import official MPCL players, edit cricket profiles and enter your own ratings.</div><div class="card"><h2>Import players</h2><div class="row"><input style="max-width:350px" type="file" id="fileInput" accept=".csv,.xlsx,.xls"><button class="primary" onclick="importPlayers()">Import file</button><button class="primary" onclick="loadMPCL()">Load official MPCL list (264 players)</button><button onclick="addPlayer()">Add player manually</button><button onclick="downloadTemplate()">Download CSV template</button></div><p class="small muted">CSV imports work offline. XLSX imports use the SheetJS library loaded from a CDN and require internet access. Existing records are matched by player name and official category; review matches before repeated imports.</p></div><div class="grid">${metric('Players',db.players.length)}${metric('Rated overall',db.players.filter(p=>num(p.overall)>0).length)}${metric('Available',db.players.filter(p=>status(p)==='Available').length)}${metric('Sold / Pre-signed',db.players.filter(p=>['Sold','Pre-Signed'].includes(status(p))).length)}</div><div class="card"><div class="row between"><h2>Scouting ratings</h2><input style="max-width:270px" placeholder="Search players" value="${esc(filter)}" oninput="filter=this.value;draw()"></div><div class="tablewrap"><table><tr><th>Player</th><th>Category</th><th>Role</th><th>Bat</th><th>Bowl</th><th>Field</th><th>WK</th><th>Impact</th><th>Status</th><th>Edit</th></tr>${list.slice(0,500).map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.category)}</td><td>${esc(p.role)}</td>${['batRate','bowlRate','fieldRate','wkRate','overall'].map(k=>`<td><input style="width:58px" type="number" min="1" max="10" value="${esc(p[k]||'')}" onchange="setRating('${p.id}','${k}',this.value)"></td>`).join('')}<td>${esc(status(p))}</td><td><button onclick="editPlayer('${p.id}')">Edit</button></td></tr>`).join('')}</table></div>${list.length===0?'<div class="empty">No matching players.</div>':''}</div>`}function setRating(id,k,v){let p=player(id);if(!p)return;if(v!==''&&(!Number.isInteger(Number(v))||Number(v)<1||Number(v)>10)){alert('Ratings must be 1–10 or blank.');draw();return}p[k]=v===''?null:Number(v);save()}function addPlayer(){editPlayer('')}function editPlayer(id){let p=player(id)||{id:'',name:'',category:'Uncapped',role:'',secondary:'',age:'',batting:'',bowling:'',position:'',outstation:'Unknown',notes:''};modal(`<h2>${id?'Edit player':'Add player'}</h2><div class="two"><div><label>Name</label><input id="pname" value="${esc(p.name)}"><label>Category</label><select id="pcat">${categories.map(c=>`<option ${p.category===c?'selected':''}>${c}</option>`).join('')}</select><label>Primary role</label><input id="prole" value="${esc(p.role)}"><label>Secondary roles (comma separated)</label><input id="psecondary" value="${esc(p.secondary)}"><label>Age</label><input id="page" type="number" value="${esc(p.age)}"></div><div><label>Batting hand</label><input id="pbat" value="${esc(p.batting)}"><label>Bowling style</label><input id="pbowl" value="${esc(p.bowling)}"><label>Batting position</label><input id="ppos" value="${esc(p.position)}"><label>Outstation</label><select id="pout">${['Unknown','No','Yes'].map(c=>`<option ${p.outstation===c?'selected':''}>${c}</option>`).join('')}</select><label>Scouting notes</label><textarea id="pnotes">${esc(p.notes)}</textarea></div></div><div class="buttons"><button class="primary" onclick="savePlayer('${id}')">Save player</button><button onclick="closeModal()">Cancel</button></div>`)}function savePlayer(id){let name=document.getElementById('pname').value.trim();if(!name){alert('Player name required');return}let p=id?player(id):{id:uid()};Object.assign(p,{name,category:document.getElementById('pcat').value,role:document.getElementById('prole').value,secondary:document.get function loadMPCL(){if(role!=='admin')return;let add=0,upd=0;MPCL_LIST.forEach(d=>{let e=db.players.find(p=>p.name.toLowerCase()===d.name.toLowerCase()&&p.category===d.category);if(e){Object.assign(e,d);upd++}else{db.players.push({id:uid(),...d});add++}});audit('Import','MPCL list: '+add+' added, '+upd+' updated');save();draw();toast(add+' players added, '+upd+' updated. Ratings, targets and results untouched.')}
/* ===== CLOUD SYNC (Firebase) ===== */
const ENABLE_CLOUD=false;const FIREBASE_CFG=null; /* GitHub hosting: paste {apiKey:"...",authDomain:"...",projectId:"...",appId:"...",adminEmail:"you@x.com"} here to skip the in-app setup */
let CFG=FIREBASE_CFG;try{CFG=CFG||JSON.parse(localStorage.getItem('aiq_fbcfg'))}catch(e){}
const CLOUD=()=>!!(CFG&&CFG.apiKey&&CFG.projectId&&CFG.adminEmail);
let fb=null,fbDoc=null,fbUser=null,fbState='',pushT=null,unsub=null;const CID=uid(),lsSave=save;
function loadScript(u){return new Promise((ok,no)=>{let e=document.createElement('script');e.src=u;e.onload=ok;e.onerror=()=>no(new Error('Could not load Firebase (check internet)'));document.head.append(e)})}
async function fbInit(){if(fb)return fb;if(!window.firebase){const b='https://cdn.jsdelivr.net/npm/firebase@10.12.2/';for(const f of['firebase-app-compat.js','firebase-auth-compat.js','firebase-firestore-compat.js'])await loadScript(b+f)}
 const {adminEmail,...c}=CFG;const app=firebase.apps&&firebase.apps.length?firebase.app():firebase.initializeApp(c);fb={auth:firebase.auth(),fs:firebase.firestore()};fbDoc=fb.fs.collection('auctioniq').doc('state');return fb}
function setBadge(){let e=document.getElementById('cloudst');if(!e)return;const m={live:'☁ Live',saving:'☁ Saving…',empty:'☁ Cloud empty',seeding:'☁ Publishing…'};e.textContent=m[fbState]||(fbState?'☁ '+fbState:'')}
function pushNow(){clearTimeout(pushT);if(!fbDoc||role!=='admin')return Promise.resolve();let c=JSON.parse(JSON.stringify(db));c.teams.forEach(t=>t.logo='');
 return fbDoc.set({data:JSON.stringify(c),rev:Date.now(),by:CID}).then(()=>{fbState='live';setBadge()}).catch(e=>{fbState='error: '+(e.code||e.message);setBadge();toast('Cloud save failed: '+(e.code||e.message))})}
function schedulePush(){clearTimeout(pushT);fbState='saving';setBadge();pushT=setTimeout(pushNow,350)}
save=function(){lsSave();if(CLOUD()&&role==='admin'&&fbDoc)schedulePush()};
function fbSubscribe(){unsub&&unsub();unsub=fbDoc.onSnapshot(snap=>{if(snap.metadata&&snap.metadata.hasPendingWrites)return;
 if(!snap.exists){if(role==='admin'){fbState='seeding';setBadge();pushNow()}else{fbState='empty';setBadge();toast('Cloud is empty – the admin must publish first')}return}
 let d=snap.data();if(d.by===CID){fbState='live';setBadge();return}
 try{let n=JSON.parse(d.data);n.teams.forEach(t=>{let o=db.teams.find(x=>x.id===t.id);t.logo=o?o.logo:''});db=n;lsSave();fbState='live';if(document.querySelector('#overlay .modal'))setBadge();else draw()}catch(e){fbState='error: bad data';setBadge()}},
 err=>{fbState='error: '+(err.code||err.message);setBadge()})}
async function cloudStart(){if(!CLOUD())return;role=null;try{sessionStorage.removeItem('aiq_role')}catch(e){}
 try{await fbInit()}catch(e){toast(e.message);draw();return}
 fb.auth.onAuthStateChanged(u=>{fbUser=u;if(!u){unsub&&unsub();unsub=null;role=null;draw();return}role=(u.email||'').toLowerCase()===CFG.adminEmail.toLowerCase()?'admin':'viewer';fbSubscribe();draw()});draw()}
function cloudLock(){let l=document.getElementById('lock');if(!l){l=document.createElement('div');l.id='lock';document.body.append(l)}
 l.innerHTML=`<div class="lockbox"><img src="${ANVITA}" alt=""><h2>AuctionIQ · MPCL</h2><p class="muted small">Sign in</p><input id="em" type="email" placeholder="Email" autocomplete="username" style="font-size:16px;letter-spacing:0;margin-bottom:6px"><input id="pw" type="password" placeholder="Password" autocomplete="current-password" style="font-size:16px;letter-spacing:0"><div id="pinerr" class="small" style="color:var(--red);min-height:18px"></div><button class="primary" id="pinbtn">Sign in</button><p class="small muted" style="margin-top:14px"><a href="#" id="disc" style="color:var(--muted)">Disconnect cloud (use local PIN mode)</a></p></div>`;l.style.display='grid';
 const go=async()=>{try{await fbInit();await fb.auth.signInWithEmailAndPassword(document.getElementById('em').value.trim(),document.getElementById('pw').value);l.style.display='none'}catch(e){document.getElementById('pinerr').textContent=/network|load/i.test(e.message)?'No internet connection':'Wrong email or password'}};
 document.getElementById('pinbtn').onclick=go;document.getElementById('pw').onkeydown=e=>{if(e.key==='Enter')go()};document.getElementById('disc').onclick=e=>{e.preventDefault();if(confirm('Switch this device back to local PIN mode?')){localStorage.removeItem('aiq_fbcfg');location.reload()}};document.getElementById('em').focus()}
const _showLock=showLock;showLock=function(){if(CLOUD())return cloudLock();_showLock();let b=document.querySelector('#lock .lockbox');if(ENABLE_CLOUD&&b&&!document.getElementById('cfgbox'))b.insertAdjacentHTML('beforeend','<details id="cfgbox" style="margin-top:14px;text-align:left"><summary class="small muted" style="cursor:pointer">Connect cloud sync</summary><label>Firebase config (paste from console)</label><textarea id="fbpaste" rows="5" placeholder=\'apiKey: "...", authDomain: "...", projectId: "...", appId: "..."\'></textarea><label>Admin email</label><input id="fbadmin" type="email"><button class="primary" style="margin-top:8px;width:100%" onclick="saveCloudCfg()">Save and reload</button></details>')};
function saveCloudCfg(){let t=document.getElementById('fbpaste').value,c={};t.replace(/(\w+)\s*:\s*["']([^"']+)["']/g,(m,k,v)=>{c[k]=v});c.adminEmail=document.getElementById('fbadmin').value.trim();if(!c.apiKey||!c.projectId||!c.adminEmail)return alert('Need apiKey, projectId and the admin email.');localStorage.setItem('aiq_fbcfg',JSON.stringify(c));location.reload()}
const _lockApp=lockApp;lockApp=function(){if(CLOUD()&&fb)fb.auth.signOut();else _lockApp()};
const _dec2=decorate;decorate=function(){_dec2();let rb=document.getElementById('rolebar');
 if(CLOUD()){let pc=document.getElementById('pincard');if(pc)pc.remove();if(rb&&!document.getElementById('cloudst'))rb.insertAdjacentHTML('afterbegin','<span id="cloudst" class="small" style="margin-right:8px"></span>');setBadge();
  if(page==='Settings'&&role==='admin'&&!document.getElementById('cloudcard')){let d=document.createElement('div');d.className='card';d.id='cloudcard';d.innerHTML='<h2>Cloud sync</h2><p class="small muted">Signed in as '+esc(fbUser?fbUser.email:'')+'. Every change you make is saved to the cloud automatically; viewers see it live.</p><div class="buttons"><button onclick="publishLocal()">Publish this device’s data to cloud (overwrite)</button></div><p class="small muted">Use this once to seed the cloud, or to restore from a backup. Two admin devices editing at once can overwrite each other, so use one admin device at a time.</p>';document.getElementById('app').append(d)}}};
function publishLocal(){if(role!=='admin')return;if(!confirm('Overwrite ALL cloud data with the data on this device?'))return;pushNow().then(()=>toast('Cloud data replaced'))}
cloudStart();
/* ===== PERSISTENCE: second copy, backups ===== */
const IDBK='aiq_copy';
function idb(){return new Promise((ok,no)=>{try{let r=indexedDB.open('auctioniq',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}})}
async function idbPut(v){try{let d=await idb();d.transaction('kv','readwrite').objectStore('kv').put(v,IDBK)}catch(e){}}
async function idbGet(){try{let d=await idb();return await new Promise(ok=>{let r=d.transaction('kv').objectStore('kv').get(IDBK);r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null)})}catch(e){return null}}
const _save3=save;save=function(){_save3();try{localStorage.setItem('aiq_lastsave',String(Date.now()))}catch(e){}idbPut(JSON.stringify(db))};
let persisted=null;try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().then(v=>{persisted=v;let e=document.getElementById('persistst');if(e)e.textContent=v?'Protected':'Not protected'})}catch(e){}
(async()=>{if(db.players.length||db.results.length)return;let c=await idbGet();if(!c)return;try{let d=JSON.parse(c);if(d&&Array.isArray(d.players)&&d.players.length){db=d;lsSave();toast('Restored your data from this browser’s backup copy');draw()}}catch(e){}})();
const _dl=download;download=function(text,name,type){(async()=>{try{if(window.claude&&claude.use){let d=await claude.use('downloads');if(d){await d.save({filename:name,data:text});return}}}catch(e){if(e&&e.code==='declined')return}_dl(text,name,type)})()};
function backup(){let d=new Date(),n='auctioniq_backup_'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'_'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')+'.json';try{localStorage.setItem('aiq_lastbackup',String(Date.now()))}catch(e){}download(JSON.stringify(db,null,2),n,'application/json');toast('Backup file prepared: '+n)}
const ago=t=>{if(!t)return'never';let m=Math.round((Date.now()-t)/60000);return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' days ago'};
const _dec3=decorate;decorate=function(){_dec3();if(page==='Settings'&&!document.getElementById('savecard')){let lb=+localStorage.getItem('aiq_lastbackup')||0,ls=+localStorage.getItem('aiq_lastsave')||0,d=document.createElement('div');d.className='card';d.id='savecard';d.innerHTML='<h2>Data safety</h2><p>Your data is saved automatically in this browser after every change (last save: <b>'+ago(ls)+'</b>), with a second copy kept as a fallback. Browser protection from auto-cleanup: <b id="persistst">'+(persisted===null?'checking…':persisted?'Protected':'Not protected')+'</b>.</p><p>Last backup file: <b class="'+(lb&&Date.now()-lb<864e5?'green':'red')+'">'+ago(lb)+'</b></p><div class="buttons"><button class="primary" onclick="backup()">Export backup file now</button></div><p class="small muted">Closing the laptop or browser keeps your data. Use the same browser and same address each time. Clearing browsing data, private windows or switching browsers start empty, so keep a backup file, especially after the auction day starts.</p>';document.getElementById('app').prepend(d)}};
if(db.players.length&&role){let lb=+localStorage.getItem('aiq_lastbackup')||0;if(Date.now()-lb>864e5)setTimeout(()=>toast('No backup in the last 24 hours – export one from Settings'),1500)}
draw();
</script></body></html>
